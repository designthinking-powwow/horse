        // --- 資料庫 ---
        const QUOTES = [
            // --- 第一組：商業巨擘與管理大師 ---
            { quote: "人生就像滾雪球，重要的是找到濕雪和長長的坡。", author: "股神 巴菲特", interpretation: "願你在今年找到那條長長的賽道，財富如萬馬奔騰，越滾越大。", tag: "商業巨擘" },
            { quote: "如果你想成功，你應當開闢新的道路，而不是走被踩爛的成功之路。", author: "石油大王 洛克菲勒", interpretation: "做一匹特立獨行的黑馬，闖出沒人走過的新路，一馬當先。", tag: "商業巨擘" },
            { quote: "聰明是一種天賦，而善良是一種選擇。", author: "亞馬遜創辦人 貝佐斯", interpretation: "願你選擇做一匹良駒，既有千里馬的才華，又有溫良的品格，貴人運爆棚。", tag: "商業巨擘" },
            { quote: "當這件事足夠重要時，即使勝算不大，你依然應該去做。", author: "特斯拉執行長 馬斯克", interpretation: "拿出黑馬的勇氣，不問機率，只問決心，衝就對了！", tag: "商業巨擘" },
            { quote: "成就偉業的唯一途徑，就是熱愛你所做的事。", author: "蘋果創辦人 賈伯斯", interpretation: "願你如愛跑的駿馬，樂在其中，這份熱愛將帶你跑得比誰都遠。", tag: "商業巨擘" },
            { quote: "不管你認為自己行，還是不行，你都是對的。", author: "汽車大王 福特", interpretation: "相信你是千里馬，你就是千里馬！信念決定你的馬力。", tag: "商業巨擘" },
            { quote: "想要無可取代，就必須時刻與眾不同。", author: "時尚女王 香奈兒", interpretation: "在萬馬齊喑中，願你做那匹最獨特的黑馬，風格永存。", tag: "商業巨擘" },
            { quote: "開始的辦法，就是停止說話，開始做事。", author: "迪士尼創辦人 華特·迪士尼", interpretation: "別當只會叫的馬，要當會跑的馬。行動力，是你最強的蹄鐵。", tag: "商業巨擘" },
            { quote: "永遠相信美好的事情即將發生。", author: "小米創辦人 雷軍", interpretation: "保持期待，好運「馬」上就到！", tag: "商業巨擘" },
            { quote: "今天很殘酷，明天更殘酷，後天很美好，但絕對大部分人死在明天晚上。", author: "阿里巴巴創辦人 馬雲", interpretation: "路遙知馬力，願你堅持跑過最黑的夜，迎接後天的曙光。", tag: "商業巨擘" },
            { quote: "預測未來最好的方法，就是去創造它。", author: "管理學之父 彼得·杜拉克", interpretation: "未來的韁繩在你手裡，駕馭它，創造你的馬年輝煌。", tag: "商業巨擘" },
            { quote: "心不喚物，物不至。", author: "經營之聖 稻盛和夫", interpretation: "心裡想著終點，馬蹄才會到達。願你心想事成。", tag: "商業巨擘" },
            { quote: "去冒比別人認為安全的險。", author: "星巴克創辦人 霍華·舒茲", interpretation: "富貴險中求，願你有越過柵欄的勇氣，收穫最豐美的草場。", tag: "商業巨擘" },
            { quote: "高期望是萬事之鑰。", author: "沃爾瑪創辦人 山姆·沃爾頓", interpretation: "把目標訂高一點，你這匹千里馬才剛要開始發揮實力。", tag: "商業巨擘" },
            { quote: "同理心讓你成為更好的創新者。", author: "微軟執行長 納德拉", interpretation: "願你如溫柔的良馬，善解人意，贏得團隊的信任與支持。", tag: "商業巨擘" },
            { quote: "痛苦 + 反省 = 進步。", author: "避險基金教父 瑞·達利歐", interpretation: "每一次跌倒都是為了跑得更快，願你越挫越勇。", tag: "商業巨擘" },
            { quote: "如果無所畏懼，你會怎麼做？", author: "Facebook營運長 桑德伯格", interpretation: "想像自己是無敵的戰馬，那就沒有跨不過去的坎。", tag: "商業巨擘" },
            { quote: "伸手摘星，即使徒勞無功，亦不致一手污泥。", author: "廣告大師 李奧·貝納", interpretation: "眼光放高，如天馬行空，你的格局決定你的結局。", tag: "商業巨擘" },
            { quote: "不要短打，要揮棒全壘打。", author: "廣告教父 奧格威", interpretation: "不要只求安穩，要像賽馬衝線一樣，追求極致的勝利。", tag: "商業巨擘" },
            { quote: "如果你在做改變世界的事，那你還有更重要的事要做。", author: "Google創辦人 賴瑞·佩吉", interpretation: "專注奔跑，別被路邊的風景分心，終點才是你的榮耀。", tag: "商業巨擘" },

            // --- 第二組：歷史領袖與政治家 ---
            { quote: "成功不是結局，失敗也非末日：重要的是繼續前進的勇氣。", author: "英國前首相 邱吉爾", interpretation: "馬不停蹄，才是人生常態。願你有跌倒後立刻上馬再戰的帥氣。", tag: "歷史領袖" },
            { quote: "我們唯一需要恐懼的，是恐懼本身。", author: "美國前總統 羅斯福", interpretation: "跨上戰馬，衝破恐懼的迷霧，前方就是康莊大道。", tag: "歷史領袖" },
            { quote: "勝利屬於最堅忍的人。", author: "法國軍事家 拿破崙", interpretation: "賽馬場上，拼的不只是速度，更是耐力。願你笑到最後。", tag: "歷史領袖" },
            { quote: "預測未來最好的方法，就是去創造它。", author: "美國前總統 林肯", interpretation: "別等待伯樂，自己跑出你的未來，你的馬蹄聲就是未來的節奏。", tag: "歷史領袖" },
            { quote: "我來，我見，我征服。", author: "羅馬大帝 凱薩", interpretation: "願你今年氣勢如虹，馬到成功，所到之處皆為疆土。", tag: "歷史領袖" },
            { quote: "在事情未成功之前，一切總看似不可能。", author: "南非國父 曼德拉", interpretation: "你是那匹打破「不可能」的黑馬，讓所有人跌破眼鏡。", tag: "歷史領袖" },
            { quote: "亂生於治，怯生於勇，弱生於強。", author: "春秋兵法家 孫子", interpretation: "願你在亂局中看見機會，如戰馬般精準出擊，以奇致勝。", tag: "歷史領袖" },
            { quote: "相信你能做到，你就已經完成了一半。", author: "美國前總統 西奧多·羅斯福", interpretation: "信心是最好的馬鞭，抽下去，你就贏了一半。", tag: "歷史領袖" },
            { quote: "勤奮是好運之母。", author: "美國開國元勛 富蘭克林", interpretation: "沒有天生的千里馬，只有跑出來的汗馬功勞。", tag: "歷史領袖" },
            { quote: "信心就是當你看不見整座樓梯時，依然踏出的第一步。", author: "民權領袖 馬丁·路德·金", interpretation: "勇敢跨出馬廄吧！即使看不見終點，草原就在前方。", tag: "歷史領袖" },
            { quote: "成為你在這世界上想看見的改變。", author: "印度聖雄 甘地", interpretation: "想看到萬馬奔騰，自己先成為那匹領頭馬。", tag: "歷史領袖" },
            { quote: "我們無法做偉大的事，但我們可以用偉大的愛做小事。", author: "諾貝爾和平獎得主 德蕾莎修女", interpretation: "一步一腳印，溫柔的馬也能走出偉大的旅程。", tag: "歷史領袖" },
            { quote: "未來屬於那些相信夢想之美的人。", author: "美國第一夫人 艾莉諾·羅斯福", interpretation: "以夢為馬，願你的未來如夢想般美麗。", tag: "歷史領袖" },
            { quote: "快樂不是現成的，它來自你自己的行動。", author: "西藏精神領袖 達賴喇嘛", interpretation: "跑起來，風在耳邊吹過的感覺，就是快樂。", tag: "歷史領袖" },
            { quote: "即使我知道明天世界會毀滅，我仍會種下我的蘋果樹。", author: "宗教改革領袖 馬丁·路德", interpretation: "這就是黑馬的淡定，無論環境如何，堅持做對的事。", tag: "歷史領袖" },
            { quote: "我發現我越努力，運氣就越好。", author: "美國開國元勛 傑佛遜", interpretation: "越跑越順，願你的汗水都化為好運。", tag: "歷史領袖" },
            { quote: "不要太謙虛，你沒那麼偉大。", author: "以色列總理 梅爾夫人", interpretation: "該衝就衝，該展現黑馬實力時，千萬別客氣。", tag: "歷史領袖" },
            { quote: "學習，學習，再學習。", author: "蘇聯領袖 列寧", interpretation: "職場如賽馬，只有不斷學習進化，才能永遠跑在最前面。", tag: "歷史領袖" },
            { quote: "真正的友誼，是一株生長緩慢的植物。", author: "美國開國元勛 華盛頓", interpretation: "願你路遙知馬力，日久見人心，收穫最真摯的情誼。", tag: "歷史領袖" },
            { quote: "如果你要讓人們跟隨你，你必須讓他們信任你。", author: "新加坡國父 李光耀", interpretation: "做一匹值得信賴的領頭馬，帶領團隊衝向高峰。", tag: "歷史領袖" },

            // --- 第三組：哲學、科學與思想家 ---
            { quote: "千里之行，始於足下。", author: "道家始祖 老子", interpretation: "別只想著終點，跑好腳下的每一步，黑馬傳奇就此開始。", tag: "思想家" },
            { quote: "譬如平地，雖覆一簣，進，吾往也。", author: "至聖先師 孔子", interpretation: "只要馬蹄還在往前，慢一點也沒關係，總會到達。", tag: "思想家" },
            { quote: "那些殺不死我的，必使我更強大。", author: "德國哲學家 尼采", interpretation: "願風雨將你這匹黑馬洗刷得更發亮，更強壯。", tag: "思想家" },
            { quote: "未經審視的生活是不值得過的。", author: "希臘哲學家 蘇格拉底", interpretation: "停下馬腳步思考，是為了跑對方向，不盲目奔騰。", tag: "思想家" },
            { quote: "卓越不是一種行為，而是一種習慣。", author: "希臘哲學家 亞里斯多德", interpretation: "讓優秀成為你的習慣，像良馬一樣，每一步都精準有力。", tag: "思想家" },
            { quote: "幸運，是機會正好撞上了你的努力。", author: "斯多葛學派哲學家 塞內卡", interpretation: "你已經跑了很久，今年，幸運女神會騎上你這匹馬。", tag: "思想家" },
            { quote: "不要走別人踩過的路，去沒人的地方，並留下足跡。", author: "美國思想家 愛默生", interpretation: "野馬不走尋常路，願你跑出一片屬於自己的荒野。", tag: "思想家" },
            { quote: "想像力比知識更重要。", author: "物理學巨人 愛因斯坦", interpretation: "願你天馬行空，用想像力突破邊界，創造無限可能。", tag: "思想家" },
            { quote: "生活中沒有什麼可怕的東西，只有需要理解的東西。", author: "放射線之母 居禮夫人", interpretation: "面對未知，像勇馬一樣迎上去，你會發現沒什麼好怕的。", tag: "思想家" },
            { quote: "真理一旦被發現，都是易懂的。", author: "天文學之父 伽利略", interpretation: "願你獨具慧眼，像識途老馬，總能找到正確的方向。", tag: "思想家" },
            { quote: "如果我看得比別人遠，那是因為我站在巨人的肩上。", author: "物理學之父 牛頓", interpretation: "懂得借力使力，你就能如飛馬般，一飛沖天。", tag: "思想家" },
            { quote: "我思，故我在。", author: "近代哲學之父 笛卡兒", interpretation: "奔跑時別忘了思考，智慧是你駕馭人生的韁繩。", tag: "思想家" },
            { quote: "頭頂的星空與心中的道德律。", author: "德國哲學泰斗 康德", interpretation: "願你腳踏實地奔跑，同時心懷星空般的夢想。", tag: "思想家" },
            { quote: "人生而自由，但無往不在枷鎖之中。", author: "法國啟蒙思想家 盧梭", interpretation: "掙脫枷鎖吧！做一匹真正自由的野馬。", tag: "思想家" },
            { quote: "我善養吾浩然之氣。", author: "亞聖 孟子", interpretation: "願你養足氣場，如萬馬奔騰般，氣勢磅礡。", tag: "思想家" },
            { quote: "從你的脆弱中，將誕生你的力量。", author: "心理分析學派創始人 佛洛伊德", interpretation: "不用逞強，接納脆弱，它會成為你這匹黑馬爆發的動力。", tag: "思想家" },
            { quote: "人不能兩次踏進同一條河流。", author: "古希臘哲學家 赫拉克利特", interpretation: "每一刻都是新的，像奔流的河水，像奔跑的馬，擁抱變化吧。", tag: "思想家" },
            { quote: "你擁有支配自己心靈的力量，而非外在事件。", author: "羅馬哲學皇帝 馬可·奧里略", interpretation: "做自己情緒的韁繩掌控者，心定，馬就穩。", tag: "思想家" },
            { quote: "天地與我並生，而萬物與我為一。", author: "道家代表人物 莊子", interpretation: "願你擁有天馬行空的自由，與世界和諧共舞。", tag: "思想家" },
            { quote: "存活下來的不是最強壯的，而是最能適應變化的。", author: "進化論之父 達爾文", interpretation: "願你靈活應變，在馬年的變局中，成為最後的贏家。", tag: "思想家" },

            // --- 第四組：文豪、藝術家與創作者 ---
            { quote: "人可以被毀滅，但不能被打敗。", author: "諾貝爾文學獎得主 海明威", interpretation: "只要你的馬魂還在，隨時都能東山再起，重回賽道。", tag: "文豪藝術" },

        // 馬年吉祥成語庫
        const HORSE_IDIOMS = [
            "馬到成功", "龍馬精神", "一馬當先", "萬馬奔騰", 
            "天馬行空", "駿馬奔騰", "金馬玉堂", "倚馬可待", 
            "瑞馬迎春", "祥馬獻瑞", "馬力全開", "厲兵秣馬"
        ];

        // Helper: Wrap text for Canvas
        const wrapText = (ctx, text, x, y, maxWidth, lineHeight) => {
            let words = text.split(''); // CJK char split
            let line = '';
            let currentY = y;

            for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n];
            let metrics = ctx.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                ctx.fillText(line, x, currentY);
                line = words[n];
                currentY += lineHeight;
            } else {
                line = testLine;
            }
            }
            ctx.fillText(line, x, currentY);
            return currentY + lineHeight; // Return next Y position
        };

        // --- 更穩定的複製功能 (相容性修正) ---
        const copyTextToClipboard = async (text) => {
            // 優先嘗試現代 API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.warn("Clipboard API failed, trying fallback:", err);
                }
            }

            // Fallback: 使用傳統 execCommand
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                
                // 確保 textarea 不會影響版面
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                
                textArea.focus();
                textArea.select();
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                return successful;
            } catch (err) {
                console.error("Fallback copy failed:", err);
                return false;
            }
        };

        function App() {
            const [status, setStatus] = useState('idle'); // idle, opening, revealed
            const [currentQuote, setCurrentQuote] = useState(null);
            const [currentIdiom, setCurrentIdiom] = useState("馬到成功");
            const [isFlipped, setIsFlipped] = useState(false);
            const [shareText, setShareText] = useState("分享連結"); 
            const [shareIcon, setShareIcon] = useState(<Share2 size={18} />);
            const [luckyNumber, setLuckyNumber] = useState(null); // 隨機幸運編號
            
            // 純隨機版：移除 drawnHistory 相關邏輯

            const handleDraw = () => {
                if (status !== 'idle') return;

                        'event_category': 'interaction',
                        'event_label': 'Draw'
                    });

                    const randomLuckyNum = Math.floor(Math.random() * 9000) + 1000;

                    setCurrentQuote(selectedQuote);
                    setCurrentIdiom(selectedIdiom);
                    setLuckyNumber(randomLuckyNum);
                    
                    setStatus('revealed');
                }, 1500);
            };

            const handleReset = () => {
                setIsFlipped(false);
                setStatus('idle');
                setShareText("分享連結");
                setShareIcon(<Share2 size={18} />);
            };

                e.stopPropagation();
                if (!currentQuote) return;

                        'method': 'clipboard',
                        'content_type': 'quote',
                        'item_id': currentQuote.quote
                    });

                const targetUrl = "https://www.designthinking.com.tw/horse";

                const text = `🧧 我在 Cha Cha Creative 抽到了「${currentIdiom}」！\n\n❝ ${currentQuote.quote} ❞\n— ${currentQuote.author}\n\n👉 馬年解讀：${currentQuote.interpretation}\n\n你也來抽一張專屬祝福卡：`;
                const fullText = `${text} ${targetUrl}`; 

                // 優先使用 Web Share API (手機原生分享)
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Cha Cha Creative 馬年紅包',
                            text: text,
                            url: targetUrl
                        });
                        return; 
                    } catch (err) {
                        console.log('User canceled share or API failed', err);
                    }
                } 
                
                // Fallback: 直接複製到剪貼簿
                const success = await copyTextToClipboard(fullText);
                if (success) {
                    setShareText("已複製！");
                    setShareIcon(<Check size={18} className="text-green-600" />);
                    
                    // 手機端通常有原生 Toast，這裡用 alert 確保回饋
                    // alert("連結與祝福語已複製！\n\n請前往 Line 貼上給朋友，\n邀請他們一起來抽創意紅包！");

                    setTimeout(() => {
                        setShareText("分享連結");
                        setShareIcon(<Share2 size={18} />);
                    }, 3000);
                } else {
                    alert("複製失敗，請手動截圖分享。");
                }
            };

            const handleDownload = (e) => {
                e.stopPropagation();
                if (!currentQuote) return;

                // 追蹤下載事件
                if (typeof gtag === 'function') {
                    gtag('event', 'download_image', {
                        'event_category': 'engagement',
                        'event_label': currentQuote.quote
                    });

                const canvas = document.createElement('canvas');

                canvas.height = 1200;

                // 1. 背景
                ctx.fillStyle = '#fdfbf7';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 2. 邊框
                ctx.strokeStyle = '#991b1b'; 
                ctx.lineWidth = 24;
                ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

                // 3. 標題
                ctx.fillStyle = '#991b1b';
                ctx.font = 'bold 32px serif';
                ctx.textAlign = 'center';
                ctx.fillText('CHA CHA CARD', canvas.width / 2, 110);
                ctx.font = 'bold 24px serif';

                ctx.strokeRect(100, boxTopY, canvas.width - 200, boxHeight);

                ctx.fillStyle = '#f87171';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('👉 馬年解讀：', 130, boxTopY + 50);

                ctx.fillStyle = '#991b1b';
                ctx.font = 'bold 36px serif';
                wrapText(ctx, currentQuote.interpretation, 130, boxTopY + 100, canvas.width - 260, 50);

                // 9. 底部
                ctx.fillStyle = '#d4d4d4';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Cha Cha Creative • 乙巳馬年', canvas.width / 2, canvas.height - 60);

                const link = document.createElement('a');
                link.download = `ChaCha_Card_${luckyNumber}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            return (
                <div className="min-h-screen bg-neutral-900 flex flex-col items-center justify-center p-4 font-sans overflow-hidden relative">
                {/* 背景裝飾 */}

                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20 z-0 mix-blend-overlay"></div>
                
                <div className="absolute top-10 left-10 w-32 h-32 bg-yellow-500 rounded-full blur-[100px] opacity-20 animate-pulse"></div>
                <div className="absolute bottom-10 right-10 w-40 h-40 bg-red-500 rounded-full blur-[120px] opacity-30 animate-pulse delay-700"></div>

                <div className="z-10 w-full max-w-md flex flex-col items-center">

                        乙巳馬年
                    </h1>
                    <p className="text-red-200 text-sm mt-2 tracking-[0.2em] uppercase opacity-80">
                        Cha Cha Creative • 創意紅包
                    </p>
                    </header>

                    {/* 核心互動區 */}
                    <div className="relative w-full h-[500px] perspective-1000 flex justify-center items-center">
                    
                    {/* 狀態 1: 紅包未開啟 */}
                    {status === 'idle' && (

                            <div className="absolute bottom-[-10px] left-1/2 transform -translate-x-1/2 w-8 h-8 bg-yellow-400 rounded-full shadow-md flex items-center justify-center border-2 border-yellow-200">
                                <span className="text-red-800 font-bold text-xs">福</span>

                            <Sparkles className="w-16 h-16 text-yellow-400 animate-spin" />
                        </div>
                    )}

                    {/* 狀態 3: 卡片展示 (3D 翻轉) */}
                    {status === 'revealed' && (
                        <div 
                        className={`relative w-72 h-96 transition-all duration-700 transform-style-3d cursor-pointer ${isFlipped ? 'rotate-y-180' : ''}`}
                        onClick={() => setIsFlipped(!isFlipped)}
                        >
                        {/* 正面：紅色背景 + 文字視覺 */}
                        <div className="absolute inset-0 w-full h-full backface-hidden rounded-2xl shadow-2xl overflow-hidden border-4 border-yellow-600/30">
                            <div className="absolute inset-0 bg-gradient-to-br from-red-600 to-red-900"></div>
                            <div className="absolute inset-0 opacity-30 bg-[url('https://www.transparenttextures.com/patterns/rice-paper-2.png')]"></div>
                            
                            <div className="relative h-full flex flex-col items-center justify-center p-6 border-2 border-yellow-500/50 m-2 rounded-xl border-dashed">
                            <div className="absolute top-4 right-4 text-yellow-500/40 text-4xl font-serif font-black italic">
                                2026
                            </div>
                            
                            {/* 文字主視覺 */}
                            <div className="w-40 h-40 bg-red-600 rounded-full flex items-center justify-center shadow-lg mb-6 ring-4 ring-yellow-500/20 overflow-hidden">
                                <span className="text-7xl font-serif font-bold text-neutral-900 drop-shadow-md select-none">
                                馬
                                </span>
                            </div>

                            {/* 隨機成語 */}
                            <h2 className="text-2xl font-bold text-black bg-yellow-400 px-6 py-1 rounded-sm shadow-sm tracking-widest min-w-[160px] text-center">
                                {currentIdiom}
                            </h2>
                            <p className="mt-8 text-yellow-100/60 text-xs animate-bounce">
                                點擊翻轉查看祝福
                            </p>
                            </div>
                        </div>

                        {/* 背面：中西創意語錄 */}
                        <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-2xl shadow-2xl overflow-hidden bg-[#fdfbf7] text-neutral-800">
                            <div className="h-full flex flex-col p-6 items-center justify-between border-8 border-red-800">
                            <div className="w-full flex justify-between items-center opacity-50">
                                <span className="text-[10px] tracking-widest text-red-800">CHA CHA CARD</span>
                                <span className="text-[10px] font-bold text-red-800">NO. {luckyNumber}</span>
                            </div>

                            {/* 卡片內容區 - 上方：名人金句 */}
                            <div className="flex-1 flex flex-col items-center justify-center text-center w-full mt-2">
                                <div className="mb-2">
                                <span className="inline-block px-3 py-1 bg-neutral-200 text-neutral-700 text-[10px] rounded-full font-bold">
                                    #{currentQuote?.tag}
                                </span>
                                </div>
                                
                                <h3 className="text-lg font-bold text-neutral-900 leading-snug font-serif mb-2 px-2">
                                「{currentQuote?.quote}」
                                </h3>
                                <p className="text-xs text-neutral-500 italic mb-4">
                                — {currentQuote?.author}
                                </p>

                                {/* 卡片內容區 - 下方：馬年解讀 */}
                                <div className="w-full bg-red-50 p-3 rounded-lg border border-red-100 relative mt-1">
                                <p className="text-[10px] text-red-400 font-bold mb-1 text-left">👉 馬年解讀：</p>
                                <p className="text-sm text-red-800 font-medium leading-relaxed text-left">
                                    {currentQuote?.interpretation}
                                </p>
                                </div>
                            </div>

                            <div className="w-full pt-3 border-t border-red-100 flex justify-center gap-4 mt-2">
                                <button 
                                    onClick={handleShareClick}
                                    className="text-neutral-400 hover:text-red-600 transition-colors flex flex-col items-center gap-1 min-w-[60px]"
                                >
                                    {shareIcon}
                                    <span className="text-[10px]">{shareText}</span>
                                </button>

                                <div className="w-px h-8 bg-neutral-200"></div>

                                <button 
                                    onClick={handleDownload}
                                    className="text-neutral-400 hover:text-red-600 transition-colors flex flex-col items-center gap-1 min-w-[60px]"
                                >
                                    <Download size={18} />
                                    <span className="text-[10px]">下載收藏</span>
                                </button>
                            </div>
                            </div>
                        </div>
                        </div>
                    )}
                    </div>

                    {/* 底部品牌宣傳 & 補貨按鈕 */}
                    <footer className="mt-6 text-center space-y-4">
                        <div className="flex flex-col items-center w-full max-w-xs mx-auto">
                        {status === 'revealed' && (
                             <div className="mb-4 w-full bg-white/10 p-4 rounded-xl border border-white/20 backdrop-blur-md shadow-lg animate-fade-in">
                                <h3 className="text-yellow-300 text-lg font-bold mb-3 tracking-wider">
                                    👇 傳遞好運 2 步驟 👇
                                </h3>
                                <div className="text-left text-white/95 text-base space-y-3 px-1">
                                    <p className="flex items-center gap-3">
                                        <span className="bg-yellow-500 text-black font-bold rounded-full w-6 h-6 flex items-center justify-center text-sm shrink-0 shadow-sm">1</span>
                                        <span className="drop-shadow-sm">點擊 <b>分享</b> 或 <b>下載</b></span>
                                    </p>
                                    <p className="flex items-center gap-3">
                                        <span className="bg-yellow-500 text-black font-bold rounded-full w-6 h-6 flex items-center justify-center text-sm shrink-0 shadow-sm">2</span>
                                        <span className="drop-shadow-sm">貼給朋友，一起抽創意紅包！</span>
                                    </p>
                                </div>
                            </div>
                        )}
                        <p className="text-yellow-200/80 text-sm font-medium tracking-wider mb-2">
                            Cha Cha Creative 祝大家新年快樂！
                        </p>
                        {status === 'revealed' && (
                            <button 
                                onClick={handleReset}
                                className="flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 rounded-full text-white text-xs transition-all border border-white/20"
                            >
                                <RefreshCw size={12} /> 再抽一次
                            </button>
                        )}
                        </div>
                    </footer>

                </div>

                <style>{`
                    .perspective-1000 {
                    perspective: 1000px;
                    }
                    .transform-style-3d {
                    transform-style: preserve-3d;
                    }
                    .backface-hidden {
                    backface-visibility: hidden;
                    }
                    .rotate-y-180 {
                    transform: rotateY(180deg);
                    }
                    @keyframes float {
                    0%, 100% { transform: translateY(0); }
                    50% { transform: translateY(-10px); }
                    }
                    .animate-float {
                    animation: float 3s ease-in-out infinite;
                    }
                `}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
